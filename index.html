<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<title>브랜드 세일 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<style>
/* Layout: 온보딩(브랜드 선택) → 월간 달력 → 상세 패널 */
:root {
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#15202B; --muted:#5D6A77; --line:#D8DEE5;
  --accent:#1E5DA6; --accent-weak:#DDE8F5; --accent-ink:#163F70;
  --focus:#D9940F; --focus-weak:#FBEFD2; --focus-ink:#6E4900;
  --past:#97A2AE; --today:#C2372B; --win:#C9DAEE;
  --conf-c:#1B6B3A; --conf-bg:#D6F0E0; --prob-c:#7A5C00; --prob-bg:#FFF0BC;
  --pred-c:#2B5FAD; --pred-bg:#DCE8FF;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --ink:#E5EBF1; --muted:#9AA7B5; --line:#2A3644;
  --accent:#7DB0EC; --accent-weak:#1C3250; --accent-ink:#CFE2F8;
  --focus:#EDB443; --focus-weak:#3A2D10; --focus-ink:#F6D58E;
  --past:#5F6B78; --today:#F07A6E; --win:#284667;
  --conf-c:#5BD48A; --conf-bg:#0D3321; --prob-c:#F5C842; --prob-bg:#2A2000;
  --pred-c:#7AADFF; --pred-bg:#0A1D40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --ink:#E5EBF1; --muted:#9AA7B5; --line:#2A3644;
  --accent:#7DB0EC; --accent-weak:#1C3250; --accent-ink:#CFE2F8;
  --focus:#EDB443; --focus-weak:#3A2D10; --focus-ink:#F6D58E;
  --past:#5F6B78; --today:#F07A6E; --win:#284667;
  --conf-c:#5BD48A; --conf-bg:#0D3321; --prob-c:#F5C842; --prob-bg:#2A2000;
  --pred-c:#7AADFF; --pred-bg:#0A1D40; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px;margin:0}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brandmark{display:flex;flex-direction:column;gap:2px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;letter-spacing:.01em}
.sample{font-size:12px;color:var(--muted)}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px}
.ghost:hover{border-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* 온보딩 */
.onb{display:flex;flex-direction:column;gap:16px}
.onb-head{display:flex;flex-direction:column;gap:6px}
.onb-head h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.onb-head p{margin:0;color:var(--muted);font-size:14px;max-width:34em}
.search{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow .search{flex:1 1 auto;min-width:0}
.searchrow .ghost{flex:none;white-space:nowrap}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.bcard .nm{font-weight:600;font-size:14px}
.bcard .sub{font-size:11px;color:var(--muted)}
.bcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak)}
.bcard[aria-pressed="true"] .nm::after{content:" ✓";color:var(--accent)}
.onb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 16px;flex-wrap:wrap}
.onb-top .onb-head{flex:1 1 280px;min-width:0}
.onb-bar{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.onb-bar .cnt{font-size:12px;color:var(--muted)}
@media (max-width:480px){.onb-bar{flex-direction:row-reverse;align-items:center;width:100%;justify-content:space-between}}
.primary{background:var(--accent);color:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:14px}
.primary:disabled{opacity:.4;cursor:default}
.primary[aria-pressed="true"]{background:var(--surface);color:var(--accent)}

/* 요약 */
.summary{display:flex;flex-direction:column;gap:4px}
.sumline{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.sumline .ghost{padding:5px 10px;font-size:13px}
.summary .big{font-size:17px;font-weight:600;text-wrap:balance}
.summary .big em{font-style:normal;color:var(--accent)}
.summary .sub{font-size:13px;color:var(--muted)}

/* 툴바 */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;min-width:7.5em;text-align:center}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.icon:disabled{opacity:.35;cursor:default}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .chip{padding:5px 11px;font-size:13px}

/* 달력 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);padding:8px 0 4px}
.dow div{padding-left:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);min-height:76px;padding-bottom:6px;position:relative}
.dnum{grid-row:1;font-size:12px;padding:4px 6px 2px;color:var(--muted)}
.dnum.out{color:var(--past);opacity:.6}
.dnum.today span{background:var(--today);color:var(--surface);border-radius:999px;padding:0 6px;font-weight:600}
.bar{display:block;min-width:0;margin:2px 2px 0;padding:2px 7px;font-size:12px;line-height:18px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;border:1px solid transparent;background:none}
.bar.confirmed{background:var(--conf-bg);color:var(--conf-c);border-color:color-mix(in srgb,var(--conf-c) 35%,transparent)}
.bar.probable{background:var(--prob-bg);color:var(--prob-c);border:1px dashed color-mix(in srgb,var(--prob-c) 60%,transparent)}
.bar.predicted{color:var(--pred-c);border:1px dashed color-mix(in srgb,var(--pred-c) 60%,transparent);background:var(--pred-bg)}
.bar.past-ev{background:transparent;color:var(--past);border:1px solid var(--past)}
.bar.band{background:var(--focus-weak);color:var(--focus-ink);border:1px solid var(--focus);font-weight:600}
.bar.more{background:transparent;color:var(--muted);border:none;text-decoration:underline;text-underline-offset:2px}
.bar.past{opacity:.6}
.bar.sel{box-shadow:0 0 0 2px var(--ink)}
.bar:hover{filter:brightness(.97)}
.bar .lbl{font-size:10px;opacity:.7;margin-right:3px}
.fsep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}

/* 주간 */
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 12px 8px;flex-wrap:wrap}
.wk-head strong{font-size:15px}
.wk-head .acts{display:flex;gap:6px}
.wk-scroll{overflow-x:auto}
.wkgrid{display:grid;grid-template-columns:88px repeat(7,minmax(44px,1fr));min-width:420px}
.wkgrid .hd{font-size:12px;color:var(--muted);padding:6px 4px;border-top:1px solid var(--line);text-align:center}
.wkgrid .hd.today{color:var(--today);font-weight:600}
.wkgrid .hd.inband{background:var(--focus-weak)}
.wkgrid .lbl{font-size:13px;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkgrid .lane{border-top:1px solid var(--line)}
.wkgrid .bar{align-self:center;margin:4px 2px}
.empty{padding:16px;color:var(--muted);font-size:14px}

.bar.mention{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.bcard.none{opacity:.5;cursor:default}
.evl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.evi{display:flex;flex-direction:column;gap:3px;min-width:0}
.evi-h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.kb{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink)}
.kb.verified_dates,.kb.naver_gpt{border-color:var(--conf-c);color:var(--conf-c)}
.kb.news{border-color:var(--accent);color:var(--accent)}
.evi-t{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.evi-q{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.evi-q mark{background:var(--focus-weak);color:var(--focus-ink);border-radius:3px;padding:0 2px}
.pill.mention{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.conf-badge.mention{color:var(--muted);border:1px dashed var(--muted)}
.sw.m{border:1px dashed var(--muted)}

.upcoming{gap:8px}
.uh{margin:0;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.urow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px}
.urow:hover{background:var(--accent-weak)}
.ub{min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um{grid-column:1;font-size:12px;color:var(--muted)}
.urow .lv{grid-row:1/3;grid-column:2}
.ud{color:var(--accent-ink);font-weight:600}
.lv{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px dashed var(--pred-c);color:var(--pred-c);background:var(--pred-bg);white-space:nowrap}
.lv.high{border-style:solid}
.lv.low{opacity:.75}
.lv.single{border-color:var(--muted);color:var(--muted);background:transparent}
.bar.predicted.single{background:transparent;opacity:.85}
.lv.conf{border:1px solid var(--conf-c);color:var(--conf-c);background:var(--conf-bg)}
.catbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.catbar .cl{font-size:12px;color:var(--muted);margin-right:2px}
.chip.sm{padding:3px 10px;font-size:12px}
.chip.clear{border-style:dashed}
.disc{font-weight:600;color:var(--accent-ink)}
.hl{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}

/* 범례 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:12px;border-radius:3px}
.sw.c{background:var(--conf-bg);border:1px solid var(--conf-c)}
.sw.p{background:var(--prob-bg);border:1px dashed var(--prob-c)}
.sw.d{background:var(--pred-bg);border:1px dashed var(--pred-c)}
.sw.b{background:var(--focus-weak);border:1px solid var(--focus)}
.sw.x{border:1px solid var(--past)}

/* 상세 패널 */
.detail{scroll-margin-top:16px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead h3{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.dhead .ev{font-size:14px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--accent);color:var(--accent)}
.pill.confirmed{background:var(--conf-c);border-color:var(--conf-c);color:#fff}
.pill.probable{background:var(--prob-bg);border:1px solid var(--prob-c);color:var(--prob-c)}
.pill.predicted{border-style:dashed;color:var(--pred-c);border-color:var(--pred-c)}
.pill.past-ev{border-color:var(--past);color:var(--past)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row .k{color:var(--muted)}
.nx{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.nxwhy{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.dacts{display:flex;gap:8px;flex-wrap:wrap}
.src{color:var(--accent);text-underline-offset:2px;word-break:break-all}
.btnlink{text-decoration:none;color:var(--ink);display:inline-block}
.note{font-size:12px;color:var(--muted);margin:0}
.conf-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;border:1px solid transparent}
.conf-badge.confirmed{background:var(--conf-bg);color:var(--conf-c);border-color:color-mix(in srgb,var(--conf-c) 35%,transparent)}
.conf-badge.probable{background:var(--prob-bg);color:var(--prob-c);border-color:color-mix(in srgb,var(--prob-c) 35%,transparent)}
.conf-badge.predicted{background:var(--pred-bg);color:var(--pred-c);border-color:color-mix(in srgb,var(--pred-c) 35%,transparent)}

@media (prefers-reduced-motion:no-preference){.bar,.chip{transition:background-color .15s,border-color .15s,opacity .15s}}
@media (max-width:480px){h1{font-size:24px}.onb-head h2{font-size:26px}.monthnav h2{font-size:21px;min-width:6.5em}.bar{padding:2px 4px;font-size:11px}.dnum{padding:4px 4px 2px}.dow div{padding-left:4px}.week{min-height:64px}.row{grid-template-columns:6em minmax(0,1fr);gap:10px}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brandmark">
      <h1>브랜드 세일 캘린더</h1>
      <span class="sample" id="sample-line">네이버 블로그·뉴스 + 직접 검증 · 2022년 이후 실제 행사 기록 · 데이터 수집 2026-10-02 기준 · 예측 기준일 2026-10-07</span>
    </div>
  </header>

  <!-- 온보딩 -->
  <section class="onb" id="onboard">
    <div class="onb-top">
    <div class="onb-head">
      <h2>어떤 브랜드의 세일을 기다리나요?</h2>
      <p>고른 브랜드의 과거 세일 기록이 달력에 채워져요. 기간이 일부만 확인된 행사도 화살표로 함께 보여줘요.</p>
    </div>
    <div class="onb-bar">
      <button class="primary" id="onb-done" disabled>캘린더 보기</button>
      <span class="cnt" id="onb-count"></span>
    </div>
    </div>
    <div class="searchrow">
      <input class="search" id="brand-search" type="search" placeholder="브랜드 검색 (예: UNIQLO, 유니클로)" autocomplete="off">
      <button class="ghost" id="onb-select-all" type="button"></button>
    </div>
    <div class="bgrid" id="brand-grid"></div>
    <p class="hint" id="no-match" hidden>찾는 브랜드가 없어요.</p>
  </section>

  <!-- 캘린더 뷰 -->
  <div id="calview" hidden>
    <section class="summary">
      <div class="sumline">
        <div class="big" id="sum-big" aria-live="polite"></div>
        <button class="ghost" id="btn-brands">브랜드 관리</button>
      </div>
      <div class="sub" id="sum-sub"></div>
    </section>

    <div class="toolbar">
      <div class="monthnav">
        <button class="icon" id="prev" aria-label="이전 달">‹</button>
        <h2 id="month-title"></h2>
        <button class="icon" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="필터"></div>
    </div>

    <section class="cal" id="cal"></section>

    <div class="legend">
      <span><i class="sw c"></i>확정</span>
      <span><i class="sw p"></i>유력</span>
      <span><i class="sw m"></i>기간 미확인</span>
      <span><i class="sw d"></i>예상(반복 패턴)</span>
      <span><i class="sw d" style="background:transparent"></i>참고(작년 1회 기록)</span>
      <span><i class="sw c" style="opacity:.6"></i>흐리게 = 종료된 행사</span>
      <span><i class="sw b"></i>3곳 이상 겹침</span>
      <span>→ 종료일 미공지 · ← 시작일 미확인</span>
    </div>

    <section class="panel detail" id="detail" hidden></section>
  </div>
</div>

// ─── 날짜 유틸 ──────────────────────────────────────────────────────────────
const DAY = 86400000;
const dn = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/DAY; };
const dt = n => new Date(n*DAY);
const md = n => `${dt(n).getUTCMonth()+1}/${dt(n).getUTCDate()}`;
const ymd = n => `${dt(n).getUTCFullYear()}.${String(dt(n).getUTCMonth()+1).padStart(2,'0')}.${String(dt(n).getUTCDate()).padStart(2,'0')}`;
const WD = ['일','월','화','수','목','금','토'];
const TODAY_STR = DATA.today;
const T = dn(TODAY_STR);
const OPEN_DAYS = 7;   // 종료일을 모를 때 달력에 그리는 길이

// 표시용 S/E 계산: 정밀도별로 다르게
const EVENTS = [];
Object.entries(DATA.brands).forEach(([brand, evs]) => {
  evs.forEach((e, i) => {
    let S, E, head = '', tail = '';
    if (e.precision === 'exact_range') { S = dn(e.start); E = dn(e.end); }
    else if (e.precision === 'start_only') { S = dn(e.start); E = S + OPEN_DAYS - 1; tail = ' →'; }
    else if (e.precision === 'end_only') {
      E = dn(e.end);
      const a = e.approx_start ? dn(e.approx_start) : null;
      S = (a !== null && E - a <= 45) ? a : E - OPEN_DAYS + 1; head = '← ';
    }
    else { S = dn(e.start); E = S + OPEN_DAYS - 1; tail = ' ?'; }
    const conf = e.confidence === 'mention' ? 'mention' : e.confidence;
    EVENTS.push({ ...e, id: `${brand}#${i}`, brand, name: e.event_name, conf, S, E, head, tail, isPast: E < T });
  });
});
(DATA.predicted || []).forEach((e, i) => {
  let S, E, head = '', tail = '';
  if (e.start && e.end) { S = dn(e.start); E = dn(e.end); }
  else if (e.start) { S = dn(e.start); E = S + OPEN_DAYS - 1; tail = ' →'; }
  else { E = dn(e.end); S = E - OPEN_DAYS + 1; head = '← '; }
  if (E < T) return;
  EVENTS.push({ ...e, id:`pred#${i}`, brand:e.brand, name:e.event_name, conf:'predicted',
    precision: e.start && e.end ? 'exact_range' : (e.start ? 'start_only' : 'end_only'),
    S, E, head, tail, isPast:false, host_type:'brand_direct', store_scope:'chain', evidence:[],
    discount: e.expected_discount ? {max:e.expected_discount, text:`과거 최대 ${e.expected_discount}%`} : null,
    categories: e.categories || [] });
});

const BRANDS = Object.keys(DATA.brands);
const countOf = b => EVENTS.filter(e => e.brand === b && e.conf !== 'predicted').length;

  get(k,f){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(_){ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
};

};
const MIN_YM = [2022,0], MAX_YM = [2027,5];

// ─── 필터 ───────────────────────────────────────────────────────────────────
const CATS = ['아우터','상의','하의','신발','가방·잡화','이너웨어','키즈'];
const catOk = ev => !state.cats.size || (ev.categories||[]).includes('전 품목') || (ev.categories||[]).some(c => state.cats.has(c));
const mine = () => EVENTS.filter(ev => state.brands.has(ev.brand) && state.show.has(ev.conf) && catOk(ev));

function monthRange() {
  const [y,m] = state.ym;
  const first = Date.UTC(y,m,1)/DAY, last = Date.UTC(y,m+1,0)/DAY;
  return {first, last, gStart: first - dt(first).getUTCDay(), gEnd: last + (6 - dt(last).getUTCDay())};
}

// 집중 행사기간: 날짜가 실제로 확인된 행사(확정·유력, 기간 미확인 제외)만 센다
function bands(from, to) {
  const solid = mine().filter(ev => (ev.conf==='confirmed'||ev.conf==='probable') && ev.precision!=='mention_only');
  const segs = []; let cur = null;
  for (let d = from; d <= to; d++) {
    const n = new Set(solid.filter(ev => ev.S <= d && ev.E >= d).map(ev => ev.brand)).size;
    if (n >= 3) { if (cur && cur.e === d-1) cur.e = d; else { cur = {s:d,e:d}; segs.push(cur); } }
    else cur = null;
  }
  return segs;
}

// ─── 온보딩 ─────────────────────────────────────────────────────────────────
function renderOnboard() {
  const q = state.q.trim().toLowerCase();
  const list = BRANDS.filter(b => !q || b.toLowerCase().includes(q) || (ALIAS[b]||'').includes(q))
    .sort((a,b) => (countOf(b)>0) - (countOf(a)>0) || a.localeCompare(b));
  $('brand-grid').innerHTML = list.map(b => {
    const n = countOf(b);
    const sub = n ? `${ALIAS[b]||''} · ${n}건` : `${ALIAS[b]||''} · 수집된 근거 없음`;
    return `<button class="bcard${n?'':' none'}" aria-pressed="${state.draft.has(b)}" data-brand="${b}" ${n?'':'disabled'}>
      <span class="nm">${b}</span><span class="sub">${sub}</span></button>`;
  }).join('');
  $('no-match').hidden = list.length > 0;
  const n = state.draft.size;
  $('onb-count').textContent = n ? `${n}곳 선택됨` : '한 곳 이상 골라주세요';
  $('onb-done').disabled = n === 0;
  $('onb-done').textContent = n ? `캘린더 보기 (${n}곳)` : '캘린더 보기';
  const selectable = list.filter(b => countOf(b) > 0);
  const allSelected = selectable.length > 0 && selectable.every(b => state.draft.has(b));
  $('onb-select-all').textContent = allSelected ? '전체 해제' : '전체 선택';
  $('onb-select-all').disabled = selectable.length === 0;
}

// ─── 요약 ───────────────────────────────────────────────────────────────────
function renderSummary() {
  const {first, last, gStart, gEnd} = monthRange();
  const [y, m0] = state.ym;
  const list = mine().filter(ev => ev.S <= last && ev.E >= first);
  const cnt = k => list.filter(e => e.conf === k).length;
  $('sum-big').innerHTML = `${y}년 ${m0+1}월 관심 브랜드 행사 <em class="num">${list.length}</em>건`;
  const segs = bands(gStart, gEnd).filter(s => s.s <= last && s.e >= first);
  const upcoming = mine().filter(ev => ev.S >= T).sort((a,b) => a.S-b.S)[0];
  const bits = [`관심 브랜드 ${state.brands.size}곳`];
  if (list.length) bits.push(['confirmed','probable','mention','predicted'].map(k => `${CONF_LABEL[k]} ${cnt(k)}`).join(' · '));
  if (segs.length) bits.push('집중 행사기간 ' + segs.map(s => `${md(s.s)}~${md(s.e)}`).join(', '));
  if (upcoming) bits.push(`다음 시작: ${upcoming.brand} ${md(upcoming.S)}${upcoming.conf==='predicted'?' (예측)':''}`);
  if (state.cats.size) bits.push(`품목 필터: ${[...state.cats].join('·')} (품목 정보가 있는 행사만)`);
  $('sum-sub').textContent = bits.join(' · ');
}

// ─── 달력 ───────────────────────────────────────────────────────────────────
function barCls(ev) {
  return `bar ${ev.conf}${ev.level === 'single' ? ' single' : ''}${ev.isPast ? ' past' : ''}${state.sel === ev.id ? ' sel' : ''}`;
}
function barText(ev, a, z, w, withBrand) {
  const head = a === ev.S ? ev.head : '↩ ';
  const tail = z === ev.E ? ev.tail : '';
  const pre = ev.conf === 'predicted' ? (ev.level === 'single' ? '참고 ' : '예상 ') : '';
  return `${head}${pre}${withBrand ? ev.brand + ' · ' : ''}${ev.name}${tail}`;
}

function renderMonth() {
  const [y,m] = state.ym;
  $('month-title').textContent = `${y}년 ${m+1}월`;
  $('prev').disabled = (y===MIN_YM[0] && m===MIN_YM[1]);
  $('next').disabled = (y===MAX_YM[0] && m===MAX_YM[1]);
  const {first, last, gStart, gEnd} = monthRange();
  const segs = bands(gStart, gEnd);
  const MAXROW = 3;

  let h = `<div class="dow">${WD.map(w=>`<div>${w}</div>`).join('')}</div>`;
  for (let w = gStart; w <= gEnd; w += 7) {
    h += `<div class="week">`;
    for (let i = 0; i < 7; i++) {
      const d = w+i, out = d<first||d>last, today = d===T;
      h += `<div class="dnum${out?' out':''}${today?' today':''}" style="grid-column:${i+1}"><span>${dt(d).getUTCDate()}</span></div>`;
    }
    let row = 2;
    const wsegs = segs.filter(s => s.s<=w+6 && s.e>=w);
    wsegs.forEach(s => {
      const a = Math.max(s.s,w), z = Math.min(s.e,w+6);
      const n = new Set(mine().filter(ev => ev.S<=s.e && ev.E>=s.s && ev.precision!=='mention_only').map(ev=>ev.brand)).size;
      h += `<button class="bar band" style="grid-row:${row};grid-column:${a-w+1}/${z-w+2}" data-week="${w}">${a===s.s ? `집중 행사기간 · ${n}곳` : '집중 행사기간 ↩'}</button>`;
    });
    if (wsegs.length) row++;

    const items = mine().filter(ev => ev.S<=w+6 && ev.E>=w)
      .sort((a,b) => ({confirmed:0,probable:1,predicted:2,mention:3}[a.conf] - {confirmed:0,probable:1,predicted:2,mention:3}[b.conf]) || a.S-b.S);
    const lanes = [], hidden = [];
    items.forEach(ev => {
      const a = Math.max(ev.S,w), z = Math.min(ev.E,w+6);
      let li = lanes.findIndex(end => end < a);
      if (li === -1) { li = lanes.length; lanes.push(z); } else lanes[li] = z;
      if (li >= MAXROW) { hidden.push(ev); return; }
      h += `<button class="${barCls(ev)}" style="grid-row:${row+li};grid-column:${a-w+1}/${z-w+2}" data-ev="${ev.id}" title="${ev.brand} · ${ev.name} (${CONF_LABEL[ev.conf]})">${barText(ev,a,z,w,true)}</button>`;
    });
    if (hidden.length) h += `<button class="bar more" style="grid-row:${row+MAXROW};grid-column:1/8" data-week="${w}">+ ${hidden.length}건 더 · 주간 보기</button>`;
    h += `</div>`;
  }
  $('cal').innerHTML = h;
}

function renderWeek() {
  const w = state.weekStart;
  const segs = bands(w-7, w+13);
  const dayInBand = d => segs.some(s => s.s<=d && s.e>=d);
  const order = {confirmed:0,probable:1,predicted:2,mention:3};
  const rows = mine().filter(ev => ev.S<=w+6 && ev.E>=w).sort((a,b) => order[a.conf]-order[b.conf] || a.S-b.S);
  let h = `<div class="wk-head"><strong class="num">${md(w)} ~ ${md(w+6)}</strong><div class="acts">
    <button class="icon" data-wk="${w-7}" aria-label="이전 주">‹</button>
    <button class="icon" data-wk="${w+7}" aria-label="다음 주">›</button>
    <button class="ghost" id="back-month">월 보기</button></div></div>`;
  h += `<div class="wk-scroll"><div class="wkgrid"><div class="hd"></div>`;
  for (let i = 0; i < 7; i++) {
    const d = w+i;
    h += `<div class="hd${d===T?' today':''}${dayInBand(d)?' inband':''}">${WD[i]}<br><span class="num">${md(d)}</span></div>`;
  }
  rows.forEach((ev,k) => {
    const r = k+2, a = Math.max(ev.S,w), z = Math.min(ev.E,w+6);
    h += `<div class="lbl" style="grid-row:${r};grid-column:1">${ev.brand}</div>`;
    h += `<div class="lane" style="grid-row:${r};grid-column:2/9"></div>`;
    h += `<button class="${barCls(ev)}" style="grid-row:${r};grid-column:${a-w+2}/${z-w+3}" data-ev="${ev.id}">${barText(ev,a,z,w,false)}</button>`;
  });
  h += `</div></div>`;
  if (!rows.length) h += `<div class="empty">이 주에는 관심 브랜드 행사가 없어요.</div>`;
  $('cal').innerHTML = h;
  const mid = dt(w+3);
  $('month-title').textContent = `${mid.getUTCFullYear()}년 ${mid.getUTCMonth()+1}월`;
}

const LEVEL = {high:'근거 강함', medium:'근거 보통', low:'근거 약함', single:'1회 기록 · 참고용'};
function renderUpcoming() {
  const list = EVENTS.filter(ev => state.brands.has(ev.brand) && ev.E >= T && catOk(ev) && ev.conf !== 'mention')
    .sort((a,b) => a.S - b.S).slice(0, 6);
  const box = $('upcoming');
  if (!list.length) { box.innerHTML = `<h3 class="uh">다가오는 세일</h3><p class="hint">관심 브랜드에서 반복되는 행사 기록이 부족해 아직 예상 일정을 낼 수 없어요.</p>`; return; }
  box.innerHTML = `<h3 class="uh">다가오는 세일 <span class="hint">오늘 ${md(T)} 기준</span></h3><ul class="ul">` + list.map(ev => {
    const until = ev.S - T;
    const when = until > 0 ? `${until}일 후` : '진행 중';
    const range = ev.start && ev.end ? `${md(dn(ev.start))}~${md(dn(ev.end))}` : ev.start ? `${md(dn(ev.start))}부터` : `~${md(dn(ev.end))}`;
    const tag = ev.conf === 'predicted' ? `<span class="lv ${ev.level}">예상 · ${LEVEL[ev.level]}</span>` : `<span class="lv conf">${CONF_LABEL[ev.conf]}</span>`;
    const disc = ev.discount ? `<span class="ud">${ev.conf==='predicted'?'과거 ':''}최대 ${ev.discount.max}%</span>` : '';
    return `<li><button class="urow" data-go="${ev.id}">
      <span class="ub"><strong>${esc(ev.brand)}</strong> ${esc(ev.name)}</span>
      <span class="um"><span class="num">${range}</span> · ${when} ${disc}</span>${tag}</button></li>`;
  }).join('') + `</ul>`;
}

function renderFilters() {
  $('filters').setAttribute('aria-label', '품목 필터');
  $('filters').innerHTML = CATS.map(c =>
    `<button class="chip" data-cat="${c}" aria-pressed="${state.cats.has(c)}">${c}</button>`).join('') +
    (state.cats.size ? `<button class="chip clear" data-cat="__all">전체</button>` : '');
}

// ─── 상세 패널 ───────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HOST = {brand_direct:'브랜드 공식', retailer_hosted:'백화점·몰 행사', platform_hosted:'플랫폼 행사'};
const KIND = {verified_dates:'직접 검증', naver_gpt:'GPT 검증', news:'뉴스', blog:'블로그', pattern:'패턴'};

function hl(quote, raw) {
  const q = esc(quote);
  if (!raw) return q;
  const r = esc(raw);
  const i = q.indexOf(r);
  return i < 0 ? q : q.slice(0,i) + `<mark>${r}</mark>` + q.slice(i + r.length);
}

function renderDetail() {
  const box = $('detail');
  const ev = EVENTS.find(e => e.id === state.sel);
  if (!ev || !state.brands.has(ev.brand)) { box.hidden = true; return; }
  box.hidden = false;
  const pillCls = ev.isPast && ev.conf !== 'mention' ? 'past-ev' : ev.conf;
  const pillTxt = ev.isPast && ev.conf !== 'mention' ? '종료' : CONF_LABEL[ev.conf];

  let dateRow;
  if (ev.precision === 'exact_range') {
    dateRow = `<div class="nx"><span class="num">${ymd(ev.S)} ~ ${ymd(ev.E)}</span><span class="nxwhy">${ev.E-ev.S+1}일간 · 시작·종료일 모두 확인</span></div>`;
  } else if (ev.precision === 'start_only') {
    const why = ev.open_ended ? '재고 소진 시까지 진행' : '종료일 미공지';
    dateRow = `<div class="nx"><span><span class="num">${ymd(ev.S)}</span> 시작 →</span><span class="nxwhy">${why}. 달력에는 ${OPEN_DAYS}일로 표시했어요.</span></div>`;
  } else if (ev.precision === 'end_only') {
    const why = ev.approx_start && ev.S === dn(ev.approx_start)
      ? `시작일 미확인. 첫 공지(${md(ev.S)})부터 표시했어요.` : `시작일 미확인. 종료일 앞 ${OPEN_DAYS}일로 표시했어요.`;
    dateRow = `<div class="nx"><span>← <span class="num">${ymd(ev.E)}</span>까지</span><span class="nxwhy">${why}</span></div>`;
  } else if (ev.precision === 'mention_only') {
    dateRow = `<div class="nx"><span><span class="num">${ymd(ev.S)}</span> 무렵 언급 ?</span><span class="nxwhy">행사가 열린 건 확인됐지만 기간은 못 찾았어요. 언급일부터 ${OPEN_DAYS}일로 표시했어요.</span></div>`;
  } else {
    dateRow = `<span class="num">${ymd(ev.S)} ~ ${ymd(ev.E)}</span>`;
  }

  const discRow = `<div class="row"><span class="k">할인</span>${ev.discount
      ? `<div class="nx"><span class="disc">${ev.conf==='predicted' ? '과거 최대 ' : '최대 '}${ev.discount.max}%</span><span class="nxwhy">${ev.conf==='predicted' ? '같은 행사의 과거 기록 기준' : `근거 문장: "${esc(ev.discount.text)}"`}${ev.discount.extra ? ` · 추가 ${ev.discount.extra}% 쿠폰 언급` : ''}</span></div>`
      : `<span class="nxwhy">근거 문서에 할인율이 나와 있지 않아요.</span>`}</div>`;
  const catRow = `<div class="row"><span class="k">품목</span>${(ev.categories||[]).length
      ? `<div class="nx"><div class="cats">${ev.categories.map(c=>`<span class="cat">${c}</span>`).join('')}</div><span class="nxwhy">근거 문서에 언급된 품목 기준이라 행사 전체 범위와 다를 수 있어요.</span></div>`
      : `<span class="nxwhy">언급된 품목 없음</span>`}</div>`;
  const host = HOST[ev.host_type] || '브랜드 공식';
  const scope = ev.store_scope === 'single_store' ? `<span class="tag">특정 매장 한정</span>` : '';
  const kinds = (ev.sources||[]).map(k => KIND[k]||k).join(' · ');
  const conflict = ev.conflict && ev.conflict_alt
    ? `<div class="row"><span class="k">날짜 차이</span><span class="nxwhy">다른 출처는 ${[ev.conflict_alt.start && '시작 '+ev.conflict_alt.start, ev.conflict_alt.end && '종료 '+ev.conflict_alt.end].filter(Boolean).join(', ')}로 적고 있어요. 온라인·오프라인 시작일 차이일 수 있어요.</span></div>` : '';

  const evid = (ev.evidence||[]).slice(0,4).map(x => `
    <li class="evi">
      <div class="evi-h"><span class="kb ${x.kind}">${KIND[x.kind]||x.kind}</span>${x.published_at?`<span class="num">${x.published_at}</span>`:''}</div>
      ${x.title && !x.title.startsWith('기존') ? `<div class="evi-t">${esc(x.title)}</div>` : ''}
      ${x.quote ? `<div class="evi-q">${hl(x.quote, x.raw_date_text)}</div>` : ''}
      ${x.link ? `<a class="src" href="${esc(x.link)}" target="_blank" rel="noopener">원문 보기 ↗</a>` : ''}
    </li>`).join('');

  const note = ev.conf==='predicted' ? `<p class="note">과거 패턴으로 예측한 날짜예요. 공식 공지가 확인되면 업데이트돼요.</p>`
    : ev.conf==='mention' ? `<p class="note">기간 미확인 행사는 '집중 행사기간' 계산에서 빠져요.</p>` : '';

  if (ev.conf === 'predicted') {
    const rng = ev.start && ev.end ? `${ymd(dn(ev.start))} ~ ${ymd(dn(ev.end))}` : ev.start ? `${ymd(dn(ev.start))} 시작 →` : `← ${ymd(dn(ev.end))} 종료`;
    const hist = (ev.history||[]).map(h => `<li><span class="num">${h.start ? ymd(dn(h.start)) : '시작 미확인'}${h.end ? ' ~ ' + ymd(dn(h.end)) : ''}</span> · ${esc(h.event_name)}${h.discount ? ` · 최대 ${h.discount}%` : ''}${h.confidence!=='confirmed' ? ' <span class="nxwhy">(유력)</span>' : ''}</li>`).join('');
    box.innerHTML = `
      <div class="dhead"><div><h3>${esc(ev.brand)}</h3><div class="ev">${esc(ev.name)}</div></div>
        <span class="pill predicted">${ev.level==='single' ? '참고용 예상' : '예상'}</span></div>
      <div class="rows">
        <div class="row"><span class="k">예상 기간</span><div class="nx"><span class="num">${rng}</span>
          <span class="nxwhy">${ev.level==='single' ? '작년 기록 기준 ±7일' : '과거 패턴상'} ${md(dn(ev.window[0]))}~${md(dn(ev.window[1]))} 사이에 ${ev.basis==='end'?'끝날':'시작할'} 가능성이 커요.</span></div></div>
        <div class="row"><span class="k">근거 수준</span><div class="nx"><span class="lv ${ev.level}">${LEVEL[ev.level]}</span><span class="nxwhy">${ev.level==='single' ? '작년 한 번만 기록됨 · 매년 열린다는 확인은 아직 없어요' : ev.method==='thanksgiving' ? `블프 날짜 규칙 · ${ev.years}개 연도 기록` : `${ev.years}개 연도 반복 · 과거 날짜 편차 ${ev.spread_days}일`}</span></div></div>
        <div class="row"><span class="k">추정 방법</span><span class="nxwhy">${esc(ev.rule)}</span></div>
        ${discRow}${catRow}
        <div class="row"><span class="k">과거 기록</span><ul class="hl">${hist}</ul></div>
      </div>
      <p class="note">공식 공지가 나오기 전 추정치예요. 공지가 확인되면 실제 일정으로 바뀌어요.</p>`;
    return;
  }

  box.innerHTML = `
    <div class="dhead">
      <div><h3>${esc(ev.brand)}</h3><div class="ev">${esc(ev.name)}</div></div>
      <span class="pill ${pillCls}">${pillTxt}</span>
    </div>
    <div class="rows">
      <div class="row"><span class="k">기간</span>${dateRow}</div>
      <div class="row"><span class="k">신뢰도</span><div class="nx"><span><span class="conf-badge ${ev.conf}">${CONF_LABEL[ev.conf]}</span></span><span class="nxwhy">근거 문서 ${ev.doc_count||0}건${kinds?' · '+kinds:''}</span></div></div>
      ${discRow}${catRow}
      <div class="row"><span class="k">주최</span><span>${host}${scope}</span></div>
      ${conflict}
      ${evid ? `<div class="row"><span class="k">근거</span><ul class="evl">${evid}</ul></div>` : ''}
    </div>
    ${note}`;
}

// ─── 렌더 ───────────────────────────────────────────────────────────────────
function render() {
  const onb = state.view === 'onboard';
  $('onboard').hidden = !onb;
  $('calview').hidden = onb;
  if (onb) { renderOnboard(); return; }
  renderFilters(); renderSummary();
  state.mode === 'month' ? renderMonth() : renderWeek();
  renderDetail();
}

const $ = id => document.getElementById(id);

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'btn-brands') { openOnboard(); return; }
  if (t.dataset.brand) {
    const b = t.dataset.brand;
    state.draft.has(b) ? state.draft.delete(b) : state.draft.add(b);
    renderOnboard(); return;
  }
  if (t.id === 'onb-select-all') {
    const q = state.q.trim().toLowerCase();
    const selectable = BRANDS.filter(b => countOf(b) > 0 && (!q || b.toLowerCase().includes(q) || (ALIAS[b]||'').includes(q)));
    const allSelected = selectable.length > 0 && selectable.every(b => state.draft.has(b));
    if (allSelected) selectable.forEach(b => state.draft.delete(b));
    else selectable.forEach(b => state.draft.add(b));
    renderOnboard(); return;
  }
  if (t.id === 'onb-done') {
    state.brands = new Set(state.draft);
    store.set('bsc3-brands', [...state.brands]);
    state.view = 'cal'; state.sel = null; render(); window.scrollTo(0,0); return;
  }
  if (t.dataset.cat) {
    const c = t.dataset.cat;
    if (c === '__all') state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
    render(); return;
  }
  if (t.dataset.go) {
    const ev = EVENTS.find(x => x.id === t.dataset.go);
    state.ym = [dt(ev.S).getUTCFullYear(), dt(ev.S).getUTCMonth()]; state.mode = 'month';
    state.sel = ev.id; render();
    $('detail').scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
    return;
  }
  if (t.id === 'prev' || t.id === 'next') {
    let [y,m] = state.ym; m += t.id==='next' ? 1 : -1;
    if (m<0) {m=11;y--;} if (m>11) {m=0;y++;}
    state.ym = [y,m]; state.mode = 'month'; render(); return;
  }
  if (t.dataset.week) { state.mode='week'; state.weekStart=Number(t.dataset.week); render(); return; }
  if (t.dataset.wk) { state.weekStart=Number(t.dataset.wk); render(); return; }
  if (t.id === 'back-month') {
    const d = dt(state.weekStart+3);
    state.ym = [d.getUTCFullYear(), d.getUTCMonth()]; state.mode = 'month'; render(); return;
  }
  if (t.dataset.ev) {
    state.sel = t.dataset.ev; render();
    const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    $('detail').scrollIntoView({behavior: reduce?'auto':'smooth', block:'nearest'});
  }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && state.sel) { state.sel=null; render(); } });
$('brand-search').addEventListener('input', e => { state.q = e.target.value; renderOnboard(); });

function openOnboard() {
  state.draft = new Set(state.brands); state.q = ''; $('brand-search').value = '';
  state.view = 'onboard'; render(); window.scrollTo(0,0);
}

if (state.brands.size > 0) { state.view = 'cal'; render(); }
else { state.draft = new Set(); render(); }
</script>
</body>
</html>
